# Publishes an accepted memo when an editor adds the "accepted" label to its
# submission request. Only the files in the memo's publish/ folder are uploaded
# to Zenodo Sandbox and copied to the public memos repository.
# When it finishes, the "accepted" label is replaced by "published". To publish
# a new version, the editor adds "accepted" again.
name: Publish memo

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

# Publish one memo at a time, so two memos never get the same ID
concurrency:
  group: publish-memo
  cancel-in-progress: false

jobs:
  publish:
    # Only runs for the "accepted" label. Only editors (Triage or higher) can add labels.
    if: github.event.label.name == 'accepted'
    runs-on: ubuntu-latest
    env:
      SUBMISSION_NUMBER: ${{ github.event.issue.number }}
      ZENODO_API: https://sandbox.zenodo.org/api
      ZENODO_COMMUNITY: skao-memos-demo
      PROJECT_NUMBER: 1 # number at the end of the review board URL
    steps:
      - name: Get a token for the memo automation app
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MEMO_APP_ID }}
          private-key: ${{ secrets.MEMO_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check out the publication script
        uses: actions/checkout@v5
        with:
          path: intake

      - name: Check out the private memo repository
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/submission-${{ github.event.issue.number }}
          token: ${{ steps.app-token.outputs.token }}
          path: memo

      - name: Check out the public memos repository
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/memos
          token: ${{ steps.app-token.outputs.token }}
          path: public

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install requests pyyaml

      - name: Get the commit identity of the app
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Publish on Zenodo and copy to the public repository
        id: publish
        env:
          MEMO_DIR: memo
          PUBLIC_DIR: public
          PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository_owner }}/memos
          MEMO_REPO_URL: ${{ github.server_url }}/${{ github.repository_owner }}/submission-${{ github.event.issue.number }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_SANDBOX_TOKEN }}
          GIT_AUTHOR_NAME: ${{ steps.bot.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.bot.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.bot.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.bot.outputs.email }}
        run: python intake/.github/scripts/publish_memo.py

      - name: Announce the result, switch the label to "published" and update the review board
        uses: actions/github-script@v8
        env:
          PUBLISH_STATUS: ${{ steps.publish.outputs.status }}
          MEMO_ID: ${{ steps.publish.outputs.memo_id }}
          MEMO_VERSION: ${{ steps.publish.outputs.version }}
          MEMO_LABEL: ${{ steps.publish.outputs.label }}
          MEMO_DOI: ${{ steps.publish.outputs.doi }}
          RECORD_URL: ${{ steps.publish.outputs.record_url }}
          PUBLIC_URL: ${{ steps.publish.outputs.public_url }}
          COMMIT: ${{ steps.publish.outputs.commit }}
          COMMIT_URL: ${{ steps.publish.outputs.commit_url }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const org = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.payload.issue.number;
            const env = process.env;

            // 1. Reply on the submission request
            let body;
            if (env.PUBLISH_STATUS === 'unchanged') {
              const next = Number(env.MEMO_VERSION) + 1;
              body = [
                `**${env.MEMO_LABEL}** has already been published, so there is nothing new to publish.`,
                '',
                `To publish a new version, set \`version: ${next}\` in memo.yaml, update the files in \`publish/\` and add the \`accepted\` label again.`,
              ].join('\n');
            } else {
              const lines = [
                `This memo has been published as **${env.MEMO_LABEL}**.`,
                '',
                `- DOI: ${env.MEMO_DOI} (Zenodo Sandbox test DOI)`,
                `- Zenodo record: ${env.RECORD_URL}`,
                `- Public copy: ${env.PUBLIC_URL}`,
              ];
              if (env.COMMIT) {
                const short = env.COMMIT.slice(0, 7);
                lines.push(`- Published from commit ${env.COMMIT_URL ? `[${short}](${env.COMMIT_URL})` : short} of the submission repository`);
              }
              lines.push('', 'Thank you for your contribution to the SKAO Memo Series (demo).');
              body = lines.join('\n');
            }
            await github.rest.issues.createComment({ owner: org, repo, issue_number: issueNumber, body });

            // 2. Switch the label from "accepted" to "published" and close the request
            try {
              await github.rest.issues.removeLabel({ owner: org, repo, issue_number: issueNumber, name: 'accepted' });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.issues.addLabels({ owner: org, repo, issue_number: issueNumber, labels: ['published'] });
            await github.rest.issues.update({
              owner: org, repo, issue_number: issueNumber, state: 'closed', state_reason: 'completed',
            });

            // 3. Move the card on the review board to "Published" (a failure here does not stop the workflow)
            try {
              const { organization } = await github.graphql(`
                query($org: String!, $number: Int!) {
                  organization(login: $org) {
                    projectV2(number: $number) {
                      id
                      field(name: "Status") {
                        ... on ProjectV2SingleSelectField { id options { id name } }
                      }
                    }
                  }
                }`, { org, number: Number(env.PROJECT_NUMBER) });
              const project = organization.projectV2;
              const option = project.field.options.find((o) => o.name === 'Published');
              if (!option) throw new Error('No "Published" column found on the board.');

              const { repository } = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $number) {
                      projectItems(first: 20) { nodes { id project { id } } }
                    }
                  }
                }`, { owner: org, repo, number: issueNumber });
              let item = repository.issue.projectItems.nodes.find((n) => n.project.id === project.id);
              if (!item) {
                const added = await github.graphql(`
                  mutation($project: ID!, $content: ID!) {
                    addProjectV2ItemById(input: { projectId: $project, contentId: $content }) { item { id } }
                  }`, { project: project.id, content: context.payload.issue.node_id });
                item = added.addProjectV2ItemById.item;
              }

              await github.graphql(`
                mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $project, itemId: $item, fieldId: $field,
                    value: { singleSelectOptionId: $option }
                  }) { projectV2Item { id } }
                }`, { project: project.id, item: item.id, field: project.field.id, option: option.id });
              core.info('Review board updated: Published');
            } catch (error) {
              core.warning(`Could not update the review board: ${error.message}`);
            }

      - name: Report a failure on the submission request
        if: failure()
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.payload.issue.number;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber,
              body: `The automatic publication of this memo did not complete. An editor should check the workflow log: ${runUrl}\n\nAfter fixing the problem, add the \`accepted\` label again.`,
            });
            // Remove "accepted" so the editor only has to add it again to retry
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: 'accepted' });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
